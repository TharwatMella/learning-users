<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
  </head>

  <body class="mt-5">
    <nav class="navbar navbar-expand-md fixed-top bg-dark navbar-dark">
      <div class="container-fluid">
        <a href="{%url 'index'%}" class="navbar-brand">Home</a>

        {% if user.is_authenticated %}
        <span class="nav text-light">Welcom: {{user}}</span>
        {% endif %}

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#clpsnav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="clpsnav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a href="{%url 'basic_app:register'%}" class="nav-link"
                >Register</a
              >
            </li>
            <li class="nav-item">
              <a href="{%url 'admin:index'%}" class="nav-link">Admin</a>
            </li>
            {%if user.is_authenticated%}
            <li class="nav-item">
              <a href="{%url 'logout'%}" class="nav-link">Logout</a>
            </li>
            {%else%}
            <li class="nav-item">
              <a href="{%url 'basic_app:user_login'%}" class="nav-link"
                >Login</a
              >
            </li>
            {%endif%}
          </ul>
        </div>
      </div>
    </nav>
    <div class="container">{%block body_block%} {% endblock %}</div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
      integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
